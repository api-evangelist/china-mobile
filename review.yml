actions:
  openapiDirectoryCreated: false
  reason: |
    No machine-readable API definition of any kind is published by China Mobile on
    any confirmed first-party host, and CAMARA's upstream specifications belong to
    the CAMARA project rather than to China Mobile, so nothing was copied into this
    repository. The openapi/ directory is deliberately absent.
  apisYmlCreated: true
  gated: true
  gatedReason: |
    Three of the four first-party surfaces require enterprise registration, a
    contract and manually issued credentials; the fourth (OneNET) is self-serve but
    mainland-oriented. The certified CAMARA Quality on Demand capability is sold
    through the communication capability platform, not exposed as a public endpoint.
