  downloadableSpecs:
    found: false
    count: 0
    probed:
    - url: https://dev.10086.cn/openapi.json
      status: 200
      result: returns the site's HTML single-page-app shell, not a spec
    - url: https://dev.10086.cn/swagger.json
      status: 403
      result: no spec
    - url: https://open.iot.10086.cn/openapi.json
      status: 500
      result: no spec
    - url: https://open.iot.10086.cn/swagger.json
      status: 500
      result: no spec
    - url: https://open.iot.10086.cn/api-docs
      status: 500
      result: no spec
    - url: https://open.iot.10086.cn/fuse-api/openapi.json
      status: 500
      result: no spec
    - url: https://api.iot.10086.cn/sitemap.xml
      status: 404
      result: no index
    note: No OpenAPI, Swagger, AsyncAPI, GraphQL SDL or .proto is published by China
      Mobile on any confirmed first-party host. The openapi/ directory is therefore
      omitted from this repository — nothing real was harvested.
  camara:
    posture: GSMA Open Gateway member since June 2023 and an active upstream CAMARA
      API sponsor with a certified QoD implementation — but nothing CAMARA-shaped is
      publicly callable or documented as an endpoint; access is domestic and
      enterprise-contracted.
    openGatewayMember: true
    openGatewayJoined: '2023-06'
    certification: GSMA Open Gateway certification announced 2024-10-29 for China
      Mobile's Network-as-a-Service (NaaS) platform after its Quality on Demand API
      passed 63 technical tests run by the Open Gateway working group; the underlying
      exposure layer is ZTE NEF/SCEF over China Mobile 4G/5G core policy control.
    apisWithEvidence:
    - name: Quality on Demand
      evidence: certified by GSMA Open Gateway (63 tests, announced 2024-10-29); a
        QoS保障 intelligent-pipe product is listed in the ct.open.10086.cn developer
        guide
    - name: Click to Dial
      evidence: China Mobile is the sponsor of the CAMARA Click to Dial API in the
        CAMARA API backlog (template 2023/05/12, TSC approved 2023/09/07, v0.1.0
        Spring26 release 2026/05/28) with Huawei; a 点击拨号 product is listed in the
        ct.open.10086.cn developer guide
    - name: Number Verification
      evidence: GSMA Open Gateway material cites China Mobile doubling in-app
        advertising conversion via a CAMARA number-verification solution; the
        corresponding first-party product is 号码认证 / 移动认证 on dev.10086.cn delivered
        through the CMPassport unified-authentication gateway — evidence is
        press/case-study level, not a callable CAMARA endpoint
    - name: Network Slice Booking
      evidence: China Mobile is a listed participant in the CAMARA backlog entry
        (sponsors China Unicom, China Telecom, Huawei; participants include China
        Mobile and Ericsson; TSC approved 2024/01/18, v0.2.0 Spring26 2026/05/29)
    - name: Model as a Service Family
      evidence: China Mobile is the sole sponsor in the CAMARA backlog (template
        2024/09/06, TSC approved 2024/10/17, v0.1.0 fall25 2025/09/18)
    - name: Knowledge Base - Manage
      evidence: China Mobile sole sponsor, CAMARA ModelAsAService repository, v0.1.0
        fall25 2025/09/18
    - name: Q&A Assistant - Manage
      evidence: China Mobile sole sponsor, CAMARA ModelAsAService repository, v0.1.0
        fall25 2025/09/18
    - name: Q&A Assistant - Service
      evidence: China Mobile sole sponsor, CAMARA ModelAsAService repository, v0.1.0
        fall25 2025/09/18
    - name: High-throughput Elastic Network
      evidence: China Mobile sponsor with Huawei and ZTE, CAMARA backlog TSC approved
        2024/11/21, no release yet
    - name: Facial Recognition
      evidence: China Mobile sole sponsor, CAMARA backlog TSC approved 2024/12/19,
        maintainers pending, no release yet
    - name: Site-to-cloud VPN
      evidence: China Mobile listed as a participant (sponsors China Telecom and
        Huawei); CAMARA repository archived 2026/02/05 with partial progress
    pressOnly:
    - name: 5G New Calling
      note: reported as led by China Mobile and established in Open Gateway Drop 4;
        no CAMARA backlog row or public specification was located under that name in
        this review, so it is recorded as press-level evidence only
    aduna:
      member: false
      note: China Mobile is not a shareholder in Aduna. The Aduna joint venture is
        owned by Ericsson (50%) plus AT&T, Bharti Airtel, Deutsche Telekom, KDDI,
        Orange, Reliance Jio, Singtel, Telefónica, Telstra, T-Mobile, Verizon and
        Vodafone. China Mobile therefore reaches developers through its own domestic
        capability marketplaces, not through the global aggregator channel and not
        through a Western CPaaS partner.
  tmForum:
    conformanceCertification: none found
    note: No TM Forum Open API conformance certificate (TMF620, TMF622, TMF641 or
      any other) was located for China Mobile in this review. China Mobile
      participates in TM Forum programmes, but no published certification report was
      confirmed.
  threeGppExposure:
    nefScef: true
    note: China Mobile's certified Quality on Demand implementation is built on ZTE
      NEF/SCEF capability-exposure network functions over China Mobile's 4G/5G core
      differentiated policy control. 5G network slicing appears via the CAMARA
      Network Slice Booking work in which China Mobile participates. No public
      NEF/SCEF or MEC endpoint is documented.
  authModel:
    schemes:
    - name: proprietary signed request (appid + transid + ebid + SHA-256 token)
      where: IoT Card Capability Open Platform (api.iot.10086.cn/v2)
      documented: true
    - name: platform token
      where: OneNET / api.heclouds.com — anonymous call returns a token
        authentication error
      documented: true
    ciba: not found
    cibaNote: CAMARA specifies OIDC and CIBA (Client-Initiated Backchannel
      Authentication) for network-based authorization. No CIBA reference, and no
      OIDC discovery document, was found on any China Mobile host. Both
      https://dev.10086.cn/.well-known/openid-configuration and
      https://dev.10086.cn/.well-known/oauth-authorization-server return HTTP 200 but
      serve the site's HTML single-page-app shell, not JSON metadata;
      open.iot.10086.cn returns HTTP 500 and iot-api.heclouds.com HTTP 406 for the
      same paths.
  webhooks:
    found: false
    note: No public webhook or event catalogue and no AsyncAPI document was found on
      any first-party host. OneNET documents a message queue (MQ) product and MQTT
      device access, but no anonymously readable event schema catalogue.
  sdks:
    firstPartyPackages: none confirmed
    note: No first-party China Mobile SDK packages were confirmed on npm, PyPI, Maven
      or NuGet. Published integration code is inline sample code in the Chinese-language
      documentation (Java, PHP, Python, C# request samples on the IoT Card platform
      docs). GitHub organisations cmri (China Mobile Research Institute) and
      cmti95035 (China Mobile Technology USA) exist but are research/engineering
      orgs, not the API SDK distribution channel.
  channelToDevelopers: |
    Direct and domestic. China Mobile does not resell its network capabilities
    through Aduna or through a Western CPaaS partner; it operates its own
    Chinese-language capability marketplaces (dev.10086.cn for application
    capabilities, ct.open.10086.cn for communication capabilities,
    api.iot.10086.cn for IoT-card capabilities, open.iot.10086.cn for IoT device
    connectivity). Onboarding for everything except OneNET runs through enterprise
    registration, contract and manually issued credentials.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.heclouds.com
    documented: true
    note: OneNET legacy device REST API; anonymous GET /devices returns
      {"errno":3,"error":"token鉴权失败"}.
  - protocol: REST
    scheme: https
    baseURL: https://api.iot.10086.cn/v2
    documented: true
    note: IoT Card Capability Open Platform; documented operation GET/POST
      /cardinfo (CMIOT_API2003).
  - protocol: MQTT
    scheme: mqtt
    documented: true
    note: OneNET documents MQTT and multi-protocol device access; no broker host is
      published anonymously.
  - protocol: GraphQL
    documented: false
    note: No GraphQL endpoint found on any China Mobile host.
  - protocol: gRPC
    documented: false
    note: No published .proto found.
  - protocol: WebSocket
    documented: false
    note: No documented WebSocket surface found.
