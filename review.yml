      title: 中国移动·通信能力开放平台 — 文档与帮助
    - url: https://api.iot.10086.cn/
      status: 200
      verdict: capability store with anonymously readable interface documentation;
        credentials issued to enterprise customers only
      title: 中国移动物联卡能力开放平台
