aid: china-mobile
name: China Mobile
review:
  question: Does China Mobile expose a public, self-serve developer API surface, and
    what is its CAMARA / GSMA Open Gateway posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: China
  tier: mno-carrier
findings:
  summary: |
    China Mobile is the world's largest mobile network operator (about 1,005 million
    mobile customers, 110 million gigabit broadband customers as of 2025-12-31) and
    it publishes real, first-party API documentation — but almost none of it is
    self-serve, and none of it is machine-readable.

    Four distinct first-party surfaces were confirmed live. OneNET
    (open.iot.10086.cn, HTTP 200) is the only genuinely self-serve developer
    platform: an IoT PaaS with open GitBook documentation and a live REST base URL
    at api.heclouds.com, which answered an anonymous GET /devices with
    {"errno":3,"error":"token鉴权失败"} — a real token-authenticated API behind real
    docs. The IoT Card Capability Open Platform (api.iot.10086.cn, HTTP 200)
    publishes anonymous interface documentation with a concrete documented endpoint
    (GET/POST https://api.iot.10086.cn/v2/cardinfo, CMIOT_API2003) but issues
    credentials by email only to approved enterprise IoT-card customers. The
    Communication Capability Open Platform (ct.open.10086.cn, HTTP 200) publishes a
    developer guide naming voice notification, voice OTP, click-to-dial, number
    masking and QoS guarantee products, with no anonymous endpoint reference. The
    Internet Capability Open Platform (dev.10086.cn, HTTP 200) is an enterprise
    procurement console — its client bundle exposes routes for login, ability
    ordering, application management, billing, invoices and work orders, and every
    documentation path resolves to the same SPA shell.

    Zero machine-readable API definitions were found. Every OpenAPI/Swagger
    candidate probed returned either an HTML single-page-app shell, 403, 404 or 500.
    No AsyncAPI, no GraphQL, no public .proto, no public Postman workspace, and no
    first-party SDK packages on npm/PyPI/Maven/NuGet were found. The two China
    Mobile GitHub organisations that do exist — cmri (China Mobile Research
    Institute, 5 public repos) and cmti95035 (China Mobile Technology USA, 25 public
    repos) — are research and US-engineering orgs, not the provider's API SDK
    channel.

    This is the split the telecom sector study predicts, in its purest form: the
    standards work is real and substantial, and the developer surface is a contract
    desk.
