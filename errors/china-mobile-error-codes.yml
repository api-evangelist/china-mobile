format: proprietary-envelope
note: >-
  China Mobile does not use RFC 9457 problem+json anywhere. Three distinct first-party
  error envelopes were confirmed live, and two published error-code registries were
  captured verbatim from the OneNET reference. Error codes are string symbols (not
  numeric), returned inside the response envelope with HTTP 200.
