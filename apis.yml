- aid: china-mobile:onenet-iot-platform
  name: OneNET IoT Open Platform API
  description: OneNET is China Mobile's IoT PaaS, operated by its CMIOT subsidiary,
    for device connection, device management, data storage and data visualisation.
    It is the company's most genuinely developer-facing surface, with open Chinese-language
    documentation covering MQTT and multi-protocol device access, OneNET Studio, edge
    computing, device management (DMP), OTA, message queue, SMS, LBS and video capabilities.
    The legacy REST base URL api.heclouds.com is live and responds with a JSON token
    authentication error to unauthenticated calls, confirming a real token-authenticated
    device API behind the docs.
  humanURL: https://open.iot.10086.cn/doc/
  baseURL: https://api.heclouds.com
