aid: china-mobile
url: https://raw.githubusercontent.com/api-evangelist/china-mobile/refs/heads/main/apis.yml
name: China Mobile
kind: company
description: China Mobile Limited is the world's largest mobile network operator by
  subscribers, serving approximately 1,005 million mobile customers and 110 million
  gigabit broadband customers across all 31 provinces of mainland China plus Hong Kong,
  with roaming into more than 200 countries. Listed on the Hong Kong Stock Exchange
  and the Shanghai Stock Exchange and majority-owned by state-held China Mobile Communications
  Group, it runs mobile, broadband, cellular IoT, satellite internet, data centre,
  cloud and AI businesses on annual revenue of about RMB 1,050.2 billion. In the network-API
  value chain China Mobile sits squarely on the operator side, not the aggregator side.
  It joined the GSMA Open Gateway initiative in June 2023, sponsors and maintains several
  CAMARA APIs upstream (Click to Dial, the Model as a Service family, High-throughput
  Elastic Network, Facial Recognition, and co-sponsors Network Slice Booking), and
  in October 2024 secured GSMA Open Gateway certification for its Network-as-a-Service
  platform after its Quality on Demand API passed 63 conformance tests on ZTE NEF/SCEF
  exposure functions. None of that is callable from the open internet. Its API posture
  is partner-gated and domestic — the capability platforms at dev.10086.cn, ct.open.10086.cn
  and api.iot.10086.cn publish real product and interface documentation but issue credentials
  only to registered mainland enterprise customers under contract, and China Mobile
  is not a shareholder in Aduna, so it reaches developers through its own Chinese-language
  capability marketplaces rather than through the global CPaaS or aggregator channel.
  The one genuinely self-serve surface is OneNET, its IoT PaaS, which publishes open
  developer documentation and a live token-authenticated device API.
