apis:
- aid: china-mobile:onenet-studio-application-api
  name: OneNET Studio Application API
  description: The OneNET Studio application API is the one China Mobile surface with a
    complete, anonymously readable request-and-response contract. It is an action-dispatched
    gateway — every call is https://openapi.heclouds.com/{namespace}?action={Action}&version=1,
    where the namespace is application (application development), common (device management),
    lwm2m-online or lwm2m-offline. Forty-four operations are documented across devices,
    products, projects, groups, thing models, device properties and desired properties,
    thing-model service invocation, device files and scene-linkage rules. Authentication is a
    signed, time-boxed authorization header (HMAC over et, method, res and version, signature
    algorithm version 2020-05-29). Every response is a uniform envelope carrying a
    platform-generated requestId, and business failures arrive as HTTP 200 with success false
    plus a string error code. China Mobile publishes no OpenAPI for it; the OpenAPI in this
    repository was transcribed operation by operation from the published reference, with each
    operation carrying its source page in x-evidence.
  humanURL: https://open.iot.10086.cn/doc/iot_platform/book/api/introduce.html
  baseURL: https://openapi.heclouds.com
