- aid: china-mobile:iot-card-capability-platform
  name: China Mobile IoT Card Capability Open Platform API
  description: The 物联卡能力开放平台 (IoT Card Capability Open Platform) exposes cellular
    M2M SIM lifecycle and subscriber-information operations to enterprise IoT customers.
    Interface documentation is published openly — the confirmed CMIOT_API2003 码号信息查询
    (code/number information query) page documents GET/POST https://api.iot.10086.cn/v2/cardinfo,
    which resolves any one of ICCID, IMSI or MSISDN into the other two. Authentication
    is a proprietary signed-request scheme (appid, transid, ebid and a SHA-256 token
    derived from appid+password+transid) whose credentials China Mobile issues by email
    to approved enterprise IoT-card customers only. No OpenAPI is published.
  humanURL: https://api.iot.10086.cn/apiDocuments/cusInfo/codeInfoQuery.html
  baseURL: https://api.iot.10086.cn/v2
  tags:
  - IoT
  - M2M
  - SIM Management
  - Connectivity Management
  - China
  properties:
  - type: Documentation
    url: https://api.iot.10086.cn/
  - type: APIReference
    url: https://api.iot.10086.cn/apiDocuments/cusInfo/codeInfoQuery.html
- aid: china-mobile:communication-capability-platform
  name: China Mobile Communication Capability Open Platform
  description: The 通信能力开放平台 (Communication Capability Open Platform) is China Mobile's
    commercial network-capability channel and the surface where its Open Gateway work
    actually meets buyers. Its published developer guide lists audio/video products
    — 语音通知 (voice notification), 语音验证码 (voice OTP), 点击拨号 (click to dial) and 中间号
    (number masking / privacy number) — plus an intelligent-pipe product, QoS保障 (QoS
    guarantee). Click to Dial and QoS map directly to the CAMARA Click to Dial and
    Quality on Demand APIs that China Mobile sponsors upstream. The guide covers product
    introduction, quick start, interface guidance and pricing, but ordering and credentials
    require enterprise onboarding; no base URL, endpoint reference or machine-readable
    definition is published anonymously.
  humanURL: https://ct.open.10086.cn/portal/developer/docAndHelp.action
  tags:
  - Voice
  - Click to Dial
  - Number Masking
  - Quality on Demand
  - Network APIs
  - China
  properties:
  - type: Documentation
    url: https://ct.open.10086.cn/portal/developer/docAndHelp.action
  - type: Portal
    url: https://ct.open.10086.cn/portal/index.action
- aid: china-mobile:internet-capability-open-platform
  name: China Mobile Internet Capability Open Platform
  description: 中国移动互联网能力开放平台 at dev.10086.cn is the operator's application-facing
    capability marketplace, describing itself as offering 移动认证/号码认证 (mobile and number
    authentication), 大数据服务 (big data services), 通信能力 (communication capabilities),
    支付能力 (payment/carrier-billing capabilities) and promotion capabilities. In practice
    it is an enterprise procurement console rather than a developer portal — its routes
    are login, ability ordering, application management, billing, invoices and work
    orders, and every documentation route resolves to the same single-page shell for
    anonymous visitors. Its number-authentication capability is the domestic analogue
    of CAMARA Number Verification and is delivered through China Mobile's CMPassport
    unified-authentication gateway rather than through a CAMARA endpoint.
  humanURL: https://dev.10086.cn/
  tags:
  - Number Authentication
  - Identity Verification
  - Carrier Billing
  - Big Data
  - Messaging
  - China
