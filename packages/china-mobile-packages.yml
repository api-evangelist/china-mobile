docs: https://open.iot.10086.cn/doc/iot_platform/book/api/sdk.html
note: >-
  China Mobile's first-party client-library channel is the OneNET (CMIOT / 中移物联网)
  GitHub account https://github.com/cm-heclouds — 38 public repositories, blog
  http://www.heclouds.com, located in Chongqing where CMIOT is headquartered. The
  OneNET Studio "API SDK下载" page names the Java and Node SDKs there as the platform's
  official API SDKs, and the JAVA-HTTP-SDK README states verbatim that the project was
  built by 中移物联网公司 (China Mobile IoT Company) for Java developers integrating OneNET.
  Only the Java SDK is published to a package registry (Maven Central, groupId
  com.github.cm-heclouds); everything else is distributed as source from GitHub. No
  first-party China Mobile package was found on PyPI, NuGet, RubyGems, Packagist,
  crates.io or pkg.go.dev, and none of the enterprise capability platforms
  (dev.10086.cn, ct.open.10086.cn, api.iot.10086.cn) ships an SDK.
