openapi: 3.1.0
info:
  title: China Mobile OneNET Studio Application API
  version: '1'
  summary: Device, project, group, thing-model, file and scene-linkage operations on China Mobile's OneNET
    Studio IoT platform.
  description: 'OneNET Studio is China Mobile''s IoT PaaS, operated by CMIOT (中移物联网). Its application
    API is an action-dispatched gateway: every call is https://openapi.heclouds.com/{namespace}?action={Action}&version={version},
    where namespace is one of application (application development), common (device management), lwm2m-online
    or lwm2m-offline, and version is 1 for all platform interfaces.


    Every operation, HTTP method, parameter name, type, required flag and description in this document
    was transcribed from the first-party OneNET reference pages under https://open.iot.10086.cn/doc/iot_platform/book/api/
    (each operation carries its source page in x-evidence). China Mobile publishes no OpenAPI/Swagger
    of its own on any confirmed first-party host; this document is an API Evangelist derivation of the
    published reference so that the surface is machine-readable. Nothing here is invented — operations
    whose reference pages did not state a method were omitted rather than guessed.


    Because the gateway dispatches on a query parameter rather than on the path, each path key below reproduces
    the documented request line verbatim (the reference literally writes ''POST /common?action=UpdateDevice&version=1'').'
  contact:
    name: OneNET Service (中移物联网)
    email: iot_service@cmiot.chinamobile.com
    url: https://open.iot.10086.cn/doc/iot_platform/book/api/introduce.html
  x-provenance:
    generated: '2026-07-25'
    method: derived
    source: https://open.iot.10086.cn/doc/iot_platform/book/api/
servers:
- url: https://openapi.heclouds.com
  description: OneNET open API gateway (live; returns HTTP 403 to anonymous requests)
tags:
- name: Application Development
- name: Device Management
security:
- onenetAuthorization: []
paths:
  /common?action=CreateDevice&version=1:
    post:
      operationId: CreateDevice
      summary: 设备创建 (CreateDevice)
      description: OneNET Studio common namespace, action CreateDevice, version 1. Documented at https://open.iot.10086.cn/doc/iot_platform/book/api/common/createDevice.html
      tags:
      - Device Management
      security:
      - onenetAuthorization: []
      x-onenet-namespace: common
      x-onenet-action: CreateDevice
      x-evidence:
      - https://open.iot.10086.cn/doc/iot_platform/book/api/common/createDevice.html
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id:
                  type: string
                  description: 产品ID
                device_name:
                  type: string
                  description: 设备名称
                imei:
                  type: string
                  description: 'NB设备imei，15个数字组成的电子串号，设备所属产品为LwM2M时，为必填 [required: 否(LwM2M协议时必填)]'
                imsi:
                  type: string
                  description: NB设备imsi，不超过15个的数字，设备所属产品为LwM2M时，为必填
                psk:
                  type: string
                  description: NB设备所需属性，若创建未填则平台随机生成，8-16位数字字母组合
                auth_code:
                  type: string
                  description: NB设备鉴权码，1-16位数字字母组合
                desc:
                  type: string
                  description: 设备描述
              required:
              - product_id
              - device_name
      responses:
        '200':
          description: OneNET response envelope. success=true carries the business payload in data; success=false
            carries code and msg.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEnvelope'
  /common?action=BatchCreateDevices&version=1:
    post:
      operationId: BatchCreateDevices
      summary: 设备批量创建 (BatchCreateDevices)
