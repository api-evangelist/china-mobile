components:
  securitySchemes:
    onenetAuthorization:
      type: apiKey
      in: header
      name: authorization
      description: 'OneNET signed authorization token: version=2020-05-29&res=userid/{userid}&et={epoch}&method={md5|sha1|sha256}&sign={signature},
        where sign = base64(hmac_method(base64decode(accessKey), et + "\n" + method + "\n" + res + "\n"
        + version)). Reference: https://open.iot.10086.cn/doc/iot_platform/book/api/auth.html'
  schemas:
    ResponseEnvelope:
      type: object
      title: OneNET response envelope
      required:
      - requestId
      - success
      properties:
        requestId:
          type: string
          description: Unique request identifier generated by the platform for every API call.
        success:
          type: boolean
          description: Whether the call succeeded.
        code:
          type: string
          description: Error code returned on failure, e.g. iot.application.deviceNotFound.
        msg:
          type: string
          description: Error message returned on failure.
        data:
          type:
          - object
          - array
          - 'null'
          description: Business payload on success; null when the interface returns none.
